name: Sync Backend Lockfile

on:
  push:
    branches:
      - dev/local-foundation
    paths:
      - 'backend/package.json'
      - '.github/workflows/sync-backend-lock.yml'

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: dev/local-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Resolve exact lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --save-exact mongodb@7.6.0

      - name: Commit resolved lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo 'Lockfile already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package-lock.json
          git commit -m 'chore: synchronize mongodb dependency lock'
          git push origin HEAD:dev/local-foundation
