name: Backend CI

on:
  push:
    branches:
      - main
      - dev/local-foundation
  pull_request:
    branches:
      - main
      - dev/local-foundation

permissions:
  contents: read

jobs:
  verify-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      NODE_ENV: test
      PORT: 3100
      MYSQL_ROOT_PASSWORD: root_test_password
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DOCKER_PORT: 3306
      MYSQL_DATABASE: megamitra
      MYSQL_USER: megamitra_app
      MYSQL_PASSWORD: megamitra_test_password
      DATABASE_URL: mysql://megamitra_app:megamitra_test_password@127.0.0.1:3306/megamitra
      MONGODB_DATABASE: megamitra
      MONGODB_PORT: 27017
      MONGODB_URI: mongodb://127.0.0.1:27017/megamitra
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DOCKER_PORT: 6379
      REDIS_PASSWORD: ''
      CAPTCHA_HMAC_SECRET: ci-captcha-secret-00000000000000000000000000000000
      JWT_ACCESS_SECRET: ci-access-secret-000000000000000000000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-00000000000000000000000000000000

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify root handoff and brand contract
        run: node -e "const p=require('../package.json'); if (p.name !== 'megagoldenclub' || p.scripts?.verify !== 'npm --prefix backend run verify') process.exit(1)"

      - name: Verify canonical UAT documentation
        working-directory: .
        run: node scripts/verify-uat-docs.mjs

      - name: Verify integration test data isolation
        working-directory: .
        run: node scripts/verify-test-data-isolation.mjs

      - name: Start CI data services
        run: |
          docker compose -f ../docker-compose.yml up -d --wait --wait-timeout 120
          docker compose -f ../docker-compose.yml ps

      - name: Install exact dependencies
        run: npm ci

      - name: Verify dependency overrides
        run: npm ls deepmerge-ts mariadb mongodb mysql2

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency tree for high/critical findings
        run: npm audit --audit-level=high

      - name: Validate operational scripts
        run: bash -n scripts/*.sh

      - name: Verify compiled API port fallback
        run: node scripts/test-select-verify-port.mjs

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Verify guarded rank migration recovery (healthy database)
        run: node scripts/recover-failed-rank-migration.mjs

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Verify MegaGoldenClub branding contract
        run: bash ../scripts/verify-branding.sh

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Integration tests
        run: npm run test:integration

      - name: Isolated backup restore recovery drill
        env:
          MEGAGOLDENCLUB_RESTORE_DRILL_CONFIRM: 'YES'
        run: npm run verify:recovery-drill

      - name: Build reproducibly
        run: |
          rm -rf dist
          rm -f ./*.tsbuildinfo
          npm run build
          test -f dist/main.js
          rm -rf dist
          npm run build
          test -f dist/main.js

      - name: Build production frontends for browser UAT
        working-directory: .
        run: |
          npm --prefix admin ci --include=dev --no-audit --no-fund
          npm --prefix frontend ci --include=dev --no-audit --no-fund
          npm --prefix admin run build
          npm --prefix frontend run build

      - name: Verify compiled production API and browser UAT
        run: |
          test -f dist/main.js
          LOG_FILE="$(mktemp -t megagoldenclub-api-ci.XXXXXX.log)"
          UAT_FIXTURE_FILE="$(mktemp -t megagoldenclub-uat-auth-ci.XXXXXX)"
          UAT_FIXTURE_READY=""
          UAT_ADMIN_TOKEN_VALUE=""
          UAT_MEMBER_TOKEN_VALUE=""
          API_PID=""

          assert_port_available() {
            node -e '
              const net = require("node:net");
              const port = Number(process.argv[1]);
              const server = net.createServer();
              server.once("error", () => process.exit(1));
              server.listen({ host: "127.0.0.1", port, exclusive: true }, () => {
                server.close((error) => process.exit(error ? 1 : 0));
              });
            ' 3100
          }

          terminate_api() {
            if [[ -z "${API_PID}" ]]; then
              return 0
            fi
            kill -TERM -- "-${API_PID}" 2>/dev/null || true
            for _ in $(seq 1 20); do
              if ! kill -0 -- "-${API_PID}" 2>/dev/null; then
                break
              fi
              sleep 0.1
            done
            kill -KILL -- "-${API_PID}" 2>/dev/null || true
            wait "${API_PID}" 2>/dev/null || true
            API_PID=""
          }

          cleanup_uat_fixture() {
            if [[ -z "${UAT_FIXTURE_READY}" ]]; then
              rm -f "${UAT_FIXTURE_FILE}"
              return 0
            fi
            npx ts-node scripts/uat-auth-fixture.ts cleanup "${UAT_FIXTURE_FILE}"
            UAT_FIXTURE_READY=""
            UAT_ADMIN_TOKEN_VALUE=""
            UAT_MEMBER_TOKEN_VALUE=""
            rm -f "${UAT_FIXTURE_FILE}"
          }

          cleanup() {
            terminate_api
            if [[ -n "${UAT_FIXTURE_READY}" ]]; then
              npx ts-node scripts/uat-auth-fixture.ts cleanup "${UAT_FIXTURE_FILE}" >/dev/null 2>&1 || true
              UAT_FIXTURE_READY=""
            fi
            rm -f "${UAT_FIXTURE_FILE}" "${LOG_FILE}"
          }
          trap cleanup EXIT INT TERM

          if ! assert_port_available; then
            echo 'Port 3100 is already in use before compiled API verification'
            exit 1
          fi

          echo 'Creating ephemeral authenticated UAT principals'
          npx ts-node scripts/uat-auth-fixture.ts create "${UAT_FIXTURE_FILE}"
          UAT_FIXTURE_READY=1
          UAT_ADMIN_TOKEN_VALUE="$(node -e 'const fs=require("fs"); const state=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(state.admin.accessToken || "")' "${UAT_FIXTURE_FILE}")"
          UAT_MEMBER_TOKEN_VALUE="$(node -e 'const fs=require("fs"); const state=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(state.member.accessToken || "")' "${UAT_FIXTURE_FILE}")"
          if [[ -z "${UAT_ADMIN_TOKEN_VALUE}" || -z "${UAT_MEMBER_TOKEN_VALUE}" ]]; then
            echo 'Authenticated UAT fixture did not produce both access tokens'
            exit 1
          fi

          setsid npm run start:prod >"${LOG_FILE}" 2>&1 &
          API_PID=$!

          READY=""
          for _ in $(seq 1 30); do
            if ! kill -0 "${API_PID}" 2>/dev/null; then
              echo 'Compiled MegaGoldenClub API exited during startup'
              cat "${LOG_FILE}"
              exit 1
            fi
            READY="$(curl -fsS http://127.0.0.1:3100/health/ready 2>/dev/null || true)"
            if [[ "${READY}" == *'"service":"megagoldenclub-api"'* ]] && \
               [[ "${READY}" == *'"mysql":"up"'* ]] && \
               [[ "${READY}" == *'"redis":"up"'* ]] && \
               [[ "${READY}" == *'"mongodb":"up"'* ]]; then
              break
            fi
            sleep 1
          done

          if [[ "${READY}" != *'"service":"megagoldenclub-api"'* ]]; then
            echo 'Compiled MegaGoldenClub API readiness failed'
            cat "${LOG_FILE}"
            exit 1
          fi
          printf '%s\n' "${READY}"

          MEGAGOLDENCLUB_UAT_BASE_URL=http://127.0.0.1:3100 \
          UAT_ADMIN_TOKEN="${UAT_ADMIN_TOKEN_VALUE}" \
          UAT_MEMBER_TOKEN="${UAT_MEMBER_TOKEN_VALUE}" \
          ./scripts/uat-smoke.sh

          echo 'Running authenticated desktop/mobile browser UAT'
          if ! UAT_ADMIN_TOKEN="${UAT_ADMIN_TOKEN_VALUE}" \
               UAT_MEMBER_TOKEN="${UAT_MEMBER_TOKEN_VALUE}" \
               BROWSER_UAT_ARTIFACT_DIR="${RUNNER_TEMP}/megagoldenclub-browser-uat" \
               node ../scripts/verify-browser-uat.mjs; then
            echo 'Browser UAT first attempt failed; retrying once with a fresh Chrome process/profile'
            UAT_ADMIN_TOKEN="${UAT_ADMIN_TOKEN_VALUE}" \
            UAT_MEMBER_TOKEN="${UAT_MEMBER_TOKEN_VALUE}" \
            BROWSER_UAT_ARTIFACT_DIR="${RUNNER_TEMP}/megagoldenclub-browser-uat" \
            node ../scripts/verify-browser-uat.mjs
          fi

          terminate_api
          if ! cleanup_uat_fixture; then
            echo 'Authenticated UAT fixture cleanup failed'
            exit 1
          fi
          rm -f "${LOG_FILE}"
          trap - EXIT INT TERM
          if ! assert_port_available; then
            echo 'Compiled API cleanup left port 3100 in use'
            exit 1
          fi

      - name: Upload browser UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megagoldenclub-browser-uat-${{ github.sha }}
          path: ${{ runner.temp }}/megagoldenclub-browser-uat
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop CI data services
        if: always()
        run: docker compose -f ../docker-compose.yml down -v --remove-orphans
