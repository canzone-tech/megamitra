name: One-time reviewed MegaGoldenClub security lockfile refresh

on:
  push:
    branches:
      - dev/local-foundation
    paths:
      - .github/workflows/security-lock-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh-reviewed-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify one-time reviewed branch/head and update lockfile only
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          EXPECTED_PARENT='1eee1a530d87bd95110a75c156bcddf27692f759'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = 'dev/local-foundation' || test "$GITHUB_REF" = 'refs/heads/dev/local-foundation'
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm audit --omit=dev --audit-level=low
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3) process.exit(1)"
          cd ..
          git diff --check
          test "$(git diff --name-only)" = 'backend/package-lock.json'
          test -z "$(git ls-files --others --exclude-standard)"
          git fetch origin dev/local-foundation
          test "$(git rev-parse origin/dev/local-foundation)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/package-lock.json
          git commit -m 'fix(deps): apply audited compatible production security patches'
          git push origin HEAD:refs/heads/dev/local-foundation
