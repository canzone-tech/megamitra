name: UI Copy JSX Cleanup

on:
  push:
    branches:
      - dev/local-foundation
    paths:
      - .github/workflows/ui-copy-jsx-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/local-foundation
          fetch-depth: 0

      - name: Fix JSX copy and remove helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              'admin/app/security/page.tsx': (
                  "For your security, you'll be signed out after the change.",
                  'For your security, you will be signed out after the change.',
              ),
              'admin/components/presentation-config.tsx': (
                  "Manage the member portal's colors, layout and wording. Preview changes as drafts, then publish when they are ready.",
                  'Manage member portal colors, layout and wording. Preview changes as drafts, then publish when they are ready.',
              ),
          }
          for filename, (old, new) in changes.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'copy cleanup anchor missing: {filename}')
              path.write_text(text.replace(old, new))
          PY
          rm -f .github/workflows/ui-copy-jsx-cleanup.yml
          git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- admin/app/security/page.tsx admin/components/presentation-config.tsx .github/workflows/ui-copy-jsx-cleanup.yml
          git commit -m "fix: normalize production UI copy"
          git push origin HEAD:dev/local-foundation
