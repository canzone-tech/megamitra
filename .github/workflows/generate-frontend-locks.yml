name: Generate frontend lockfiles

on:
  push:
    branches:
      - dev/local-foundation
    paths:
      - '.github/workflows/generate-frontend-locks.yml'

permissions:
  contents: write

jobs:
  generate-lockfiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev/local-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate admin lockfile
        run: npm --prefix admin install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Generate member lockfile
        run: npm --prefix frontend install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate clean installs
        run: |
          npm --prefix admin ci --ignore-scripts --no-audit --no-fund
          npm --prefix frontend ci --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles already current'
          else
            git commit -m 'chore: lock frontend dependencies'
            git push origin HEAD:dev/local-foundation
          fi
