# MegaGoldenClub-only Redis instance; mount the protected users.acl file.
# No passwords or API secrets in the repository or Compose environment.
bind 0.0.0.0
protected-mode yes
port 6379
daemonize no
aclfile /run/redis/users.acl
dir /data
appendonly yes
appendfsync everysec
maxmemory 256mb
maxmemory-policy noeviction
