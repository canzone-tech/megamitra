# MegaGoldenClub HTTP-only bootstrap for the EXISTING shared Apache 2.4 server.
# Install/enable only after checking existing vhosts and HTTPS reachability.
# Certbot webroot: /var/lib/letsencrypt (create and verify before cert issuance).
# Do NOT disable existing Apache sites or enable another 80/443 reverse proxy.
# Requires mod_alias and mod_rewrite; mod_headers is required by HTTPS vhosts.

<VirtualHost *:80>
    ServerName megagoldenclub.com
    Alias "/.well-known/acme-challenge/" "/var/lib/letsencrypt/.well-known/acme-challenge/"
    <Directory "/var/lib/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteRule ^/\.well-known/acme-challenge/ - [END]
    RewriteRule ^ https://www.megagoldenclub.com%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

