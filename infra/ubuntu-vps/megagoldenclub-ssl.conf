# MegaGoldenClub HTTPS vhosts for the EXISTING Apache 2.4 shared server.
# IMPORTANT: do not enable until certbot has issued each referenced certificate.
# Does NOT replace/disable any other website and does NOT listen on new public ports.
# Requires ssl, proxy, proxy_http, rewrite and headers modules.
# All application services MUST bind 127.0.0.1:3200-3202 (never 0.0.0.0).

<VirtualHost *:443>
    ServerName megagoldenclub.com
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/megagoldenclub.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/megagoldenclub.com/privkey.pem
    RewriteEngine On
    RewriteRule ^ https://www.megagoldenclub.com%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.megagoldenclub.com
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/megagoldenclub.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/megagoldenclub.com/privkey.pem
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass "/" "http://127.0.0.1:3202/" connectiontimeout=5 timeout=60
    ProxyPassReverse "/" "http://127.0.0.1:3202/"
</VirtualHost>

<VirtualHost *:443>
    ServerName admin.megagoldenclub.com
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/admin.megagoldenclub.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/admin.megagoldenclub.com/privkey.pem
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass "/" "http://127.0.0.1:3201/" connectiontimeout=5 timeout=60
    ProxyPassReverse "/" "http://127.0.0.1:3201/"
</VirtualHost>

<VirtualHost *:443>
    ServerName api.megagoldenclub.com
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/api.megagoldenclub.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.megagoldenclub.com/privkey.pem
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    # Keep datastore status private; local /health/ready remains available to monitoring.
    RewriteEngine On
    RewriteRule ^/health(?:/|$) - [R=404,L]
    ProxyPass "/" "http://127.0.0.1:3200/" connectiontimeout=5 timeout=60
    ProxyPassReverse "/" "http://127.0.0.1:3200/"
</VirtualHost>
