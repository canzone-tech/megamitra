# One NEW dedicated MongoDB for MegaGoldenClub only.
# This project NEVER manages the existing host mongod :27017 or
# the unrelated unrelated existing MongoDB container :27018.
name: megagoldenclub-mongo
services:
  mongodb:
    image: mongo:8.0.29-noble
    container_name: megagoldenclub-mongo
    command:
      - mongod
      - --auth
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"
    environment:
      MONGO_INITDB_ROOT_USERNAME: megagoldenclub_root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_root_password
    secrets:
      - mongodb_root_password
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - megagoldenclub-mongo-data:/data/db
    restart: unless-stopped
    stop_grace_period: 90s
    mem_limit: 1024m
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
secrets:
  mongodb_root_password:
    file: /etc/megagoldenclub/mongo/root-password
volumes:
  megagoldenclub-mongo-data:
